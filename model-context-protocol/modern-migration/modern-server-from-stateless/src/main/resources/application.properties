spring.application.name=tickets-modern-server
spring.ai.mcp.server.name=tickets-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
server.port=8080

# 2026-07-28 ("modern") protocol: single POST endpoint, server/discover instead of initialize,
# cache hints on lists and resources, cursor paging. Same Java code as stateless-server
# except the ttlMs/cacheScope attributes on @McpResource.
spring.ai.mcp.server.protocol=MODERN
spring.ai.mcp.server.modern.mcp-endpoint=/mcp
spring.ai.mcp.server.modern.list-ttl=30s
spring.ai.mcp.server.modern.list-cache-scope=PRIVATE
spring.ai.mcp.server.modern.discover-ttl=5m
spring.ai.mcp.server.modern.page-size=50
