spring.application.name=tickets-modern-client-async
spring.main.web-application-type=none

# The asynchronous client type: the SDK's asynchronous client, reactive handler methods,
# and the AsyncMcpToolCallbackProvider bean. It applies to legacy and modern connections.
spring.ai.mcp.client.type=ASYNC

# The migration: the connection speaks the 2026-07-28 ("modern") protocol. A connection
# without the protocol property stays on the legacy protocol. The connection name is the
# prefix of the tool names, for example tickets_open_ticket.
spring.ai.mcp.client.streamable-http.connections.tickets.url=http://localhost:8080
spring.ai.mcp.client.streamable-http.connections.tickets.protocol=MODERN

# Keeps a listen stream open to the server, on which it reports its changes. A reported
# tool change drops a kept tool listing at once and calls the @McpToolListChanged methods.
spring.ai.mcp.client.streamable-http.connections.tickets.listen=true

# PER_REQUEST (the default) creates a client each time the tools are resolved. CUSTOM asks
# the AsyncModernMcpClientScope bean, which here keeps one client for each role. SHARED
# creates one client for the connection; with a caller provider bean it logs a warning,
# because a shared client keeps a private tool listing for every caller.
#spring.ai.mcp.client.streamable-http.connections.tickets.client-scope=CUSTOM
#spring.ai.mcp.client.streamable-http.connections.tickets.client-scope=SHARED

# A server that cannot be reached is left alone for this long and its tools are left out.
spring.ai.mcp.client.modern.unreachable-cool-down=30s

demo.admin-url=http://localhost:8080
logging.level.io.modelcontextprotocol=WARN
