spring.application.name=tasks-stateless-server
spring.ai.mcp.server.name=tasks-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
server.port=8080

# No sessions: every POST is independent. Methods with McpSyncRequestContext are skipped.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
