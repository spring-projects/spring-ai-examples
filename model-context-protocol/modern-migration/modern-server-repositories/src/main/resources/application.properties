spring.application.name=tickets-modern-repositories
spring.ai.mcp.server.name=tickets-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
server.port=8080

spring.ai.mcp.server.protocol=MODERN
spring.ai.mcp.server.modern.mcp-endpoint=/mcp
spring.ai.mcp.server.modern.list-ttl=30s
# RoleFilteringRepositoryConfiguration reads X-Role from the transport context; no header is
# stored unless it is named here.
spring.ai.mcp.server.modern.context-headers=X-Role
# No page-size: RoleFilteringRepositoryConfiguration filters tools after the in-memory
# repository has paged them, which would return short pages. TicketResourceRepository pages
# resources itself.
spring.ai.mcp.server.modern.subscriptions=true
spring.ai.mcp.server.modern.request-state-secret=change-me-in-production
