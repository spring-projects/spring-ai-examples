spring.application.name=tickets-modern-async-server
spring.ai.mcp.server.name=tickets-server
spring.ai.mcp.server.version=0.0.1
server.port=8080

spring.ai.mcp.server.protocol=MODERN
# The asynchronous API type: annotated methods may return Mono, CompletableFuture or a
# single-valued Publisher, progress goes through McpAsyncNotifier, and the in-memory
# repositories are the InMemoryAsync* ones. On WebFlux nothing blocks an event loop.
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.modern.mcp-endpoint=/mcp
spring.ai.mcp.server.modern.list-ttl=30s
spring.ai.mcp.server.modern.page-size=50
spring.ai.mcp.server.modern.keep-alive-interval=15s
spring.ai.mcp.server.modern.subscriptions=true
# MRTR requestState is HMAC-sealed; share the secret across instances behind a load balancer
spring.ai.mcp.server.modern.request-state-secret=change-me-in-production-to-32-bytes-min
spring.ai.mcp.server.modern.request-state-ttl=10m
