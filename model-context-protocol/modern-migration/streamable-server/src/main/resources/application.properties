spring.application.name=tickets-streamable-server
spring.ai.mcp.server.name=tickets-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
server.port=8080

# Sessions over Streamable HTTP (Mcp-Session-Id). Enables elicitation, sampling, logging and
# per-session list_changed notifications.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.streamable-http.keep-alive-interval=30s
spring.ai.mcp.server.tool-change-notification=true
