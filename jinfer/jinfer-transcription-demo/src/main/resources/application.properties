spring.application.name=jinfer-transcription-demo

# Setting the model is what enables the jinfer TranscriptionModel bean.
# A model reference is downloaded once on first start and cached
# (~/Library/Caches/jinfer on macOS, ~/.cache/jinfer on Linux, or $JINFER_MODELS).
# Other checkpoints from https://huggingface.co/mudler/parakeet-cpp-gguf :
#   mudler/parakeet-cpp-gguf/tdt-0.6b-v3-q4_k.gguf     - multilingual, fastest
#   mudler/parakeet-cpp-gguf/tdt-0.6b-v2-q8_0.gguf     - English only
#   mudler/parakeet-cpp-gguf/tdt_ctc-110m-q8_0.gguf    - English only, tiny and very fast
spring.ai.jinfer.transcription.model=${JINFER_TRANSCRIPTION_MODEL:mudler/parakeet-cpp-gguf/tdt-0.6b-v3-q8_0.gguf}

# Audio uploads are bigger than Spring Boot's 1MB multipart default.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
