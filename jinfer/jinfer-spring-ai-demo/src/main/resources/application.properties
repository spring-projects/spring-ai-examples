spring.application.name=jinfer-spring-ai-demo

# Select jinfer as the Spring AI chat provider.
spring.ai.model.chat=jinfer

# A Hugging Face reference ([host/]owner/repo[:quant]) is downloaded once on first start and cached
# (~/Library/Caches/jinfer on macOS, ~/.cache/jinfer on Linux, or $JINFER_MODELS). A local .gguf path also works.
# Other options to try (all need jinfer-models-all or the matching jinfer-<family> module):
#   LiquidAI/LFM2.5-350M-GGUF:Q8_0      - tiny and fast, weaker at tools
#   unsloth/Qwen3.5-2B-GGUF:Q8_0        - a reasoning model
#   unsloth/gemma-4-E2B-it-GGUF:Q8_0
# spring.ai.jinfer.chat.model=${JINFER_CHAT_MODEL:unsloth/gemma-4-E2B-it-GGUF:Q8_0}
spring.ai.jinfer.chat.model=${JINFER_CHAT_MODEL:LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q8_0}
spring.ai.jinfer.chat.context-capacity=8192
spring.ai.jinfer.chat.max-tokens=512
spring.ai.jinfer.chat.temperature=0.2
