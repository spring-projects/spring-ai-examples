spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# ---- jinfer: local chat model (in-JVM, downloaded once from Hugging Face and cached) ----
spring.ai.model.chat=jinfer
# LFM2.5-8B-A1B (MoE, ~1B active params, 8.5 GB) drives the multi-step tool-search loop reliably.
# The smaller LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q8_0 answers without ever calling toolSearchTool.
# spring.ai.jinfer.chat.model=${JINFER_CHAT_MODEL:LiquidAI/LFM2.5-8B-A1B-GGUF:Q8_0}
spring.ai.jinfer.chat.model=${JINFER_CHAT_MODEL:unsloth/gemma-4-E2B-it-GGUF}
# spring.ai.jinfer.chat.model=${JINFER_CHAT_MODEL:unsloth/Qwen3.5-0.8B-GGUF}
spring.ai.jinfer.chat.context-capacity=8192
spring.ai.jinfer.chat.max-tokens=1024
# greedy decoding keeps multi-round tool loops reproducible on small models
spring.ai.jinfer.chat.temperature=0.0

# ---- jinfer: local embedding model, backs the VectorStore used by tool-index-type=vector ----
spring.ai.model.embedding=jinfer
# https://huggingface.co/models?library=gguf&sort=trending&search=Embedding
# spring.ai.jinfer.embedding.model=${JINFER_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
# spring.ai.jinfer.embedding.model=${JINFER_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-4B-GGUF:Q4_K_M}
# spring.ai.jinfer.embedding.model=${JINFER_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B-GGUF:Q4_K_M}
spring.ai.jinfer.embedding.model=${JINFER_EMBEDDING_MODEL:LiquidAI/LFM2.5-Embedding-350M-GGUF:Q8_0}


spring.ai.jinfer.embedding.context-capacity=2048

# Tool Search Tool Advisor Configuration
spring.ai.chat.client.tool-search-advisor.enabled=true
# spring.ai.chat.client.tool-search-advisor.tool-index-type=regex
# spring.ai.chat.client.tool-search-advisor.tool-index-type=lucene
spring.ai.chat.client.tool-search-advisor.tool-index-type=vector
spring.ai.chat.client.tool-search-advisor.max-results=3

spring.ai.chat.client.tool-search-advisor.reference-tool-name-accumulation=false
# Replaces the advisor's default instruction, so it repeats it and adds how to phrase searches:
# as the task, not a keyword list (the vector index matches the meaning of the query).
spring.ai.chat.client.tool-search-advisor.system-message-suffix=\n\
You have access to a special tool called `toolSearchTool` that allows you to discover relevant tools on-demand. \
When you need to perform an action but don't see an appropriate tool in your current context, use `toolSearchTool` to search for it. \
When you call `toolSearchTool`, describe the task you need done in plain words \
(for example "find clothing shops in Landsmeer that are open right now"), not a list of keywords or alternatives.\n
